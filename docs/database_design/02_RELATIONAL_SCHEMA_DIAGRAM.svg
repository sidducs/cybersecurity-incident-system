<text x="250" y="2620" class="legend-title">Academic Relational Schema Notation &amp; Referential Integrity Reference (Elmasri &amp; Navathe Chapter 9)</text>
<rect x="260" y="2650" width="160" height="34" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8"/>
<text x="340" y="2667" class="cell-pk">Primary_Key</text>
<text x="440" y="2667" class="legend-text"><b>Primary Key (Solidly Underlined):</b> Uniquely identifies entity tuples; cannot be NULL (Entity Integrity Constraint).</text>
<rect x="260" y="2700" width="160" height="34" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8"/>
<text x="340" y="2717" class="cell-fk">Foreign_Key</text>
<text x="440" y="2717" class="legend-text"><b>Foreign Key (Referencing Field):</b> Must match candidate key value in referenced relation or be NULL (Referential Integrity).</text>
<path d="M 270 2765 L 370 2765 L 370 2750" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#fk-arrow)"/>
<text x="440" y="2758" class="legend-text"><b>Referential Integrity Directed Arrow:</b> Originates at the Foreign Key cell and points directly into the referenced Primary Key cell.</text>
<text x="260" y="2810" class="legend-text" font-weight="bold">Schema Normalization Status: All 11 relations are in 3NF and BCNF.</text>
<text x="260" y="2835" class="legend-text">• 1NF: Atomic domain values, no repeating groups  |  • 2NF: No partial key dependencies  |  • 3NF &amp; BCNF: No transitive dependencies on candidate keys.</text>
</svg>