<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersecurity Incident Intelligence - ER & Relational Schema Diagrams</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: #1e293b; border-bottom: 2px solid #ea580c; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .title-group h1 { font-size: 1.15rem; font-weight: 700; color: #f8fafc; }
        .title-group p { font-size: 0.8rem; color: #94a3b8; }
        .nav-tabs { display: flex; gap: 8px; }
        .tab-btn { background: #334155; color: #cbd5e1; border: 1px solid #475569; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
        .tab-btn.active { background: #ea580c; color: #ffffff; border-color: #ea580c; }
        .tab-btn:hover:not(.active) { background: #475569; color: #ffffff; }
        .toolbar { display: flex; gap: 8px; align-items: center; }
        .tool-btn { background: #334155; border: 1px solid #475569; color: #f8fafc; padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; }
        .tool-btn:hover { background: #475569; }
        .viewer-container { flex: 1; position: relative; overflow: auto; background: #090d16; display: flex; justify-content: center; align-items: flex-start; padding: 20px; }
        .diagram-img { max-width: 100%; height: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 4px; background: white; transition: transform 0.2s ease-out; }
    </style>
</head>
<body>
    <header>
        <div class="title-group">
            <h1>Cybersecurity Incident Correlation & Response Intelligence System</h1>
            <p>Database Management Systems — Textbook Compliant Conceptual & Logical Schema (Elmasri & Navathe)</p>
        </div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('er')">1. Chen ER Diagram</button>
            <button class="tab-btn" onclick="switchTab('schema')">2. Relational Schema Diagram</button>
        </div>
        <div class="toolbar">
            <button class="tool-btn" onclick="zoomIn()">Zoom In (+)</button>
            <button class="tool-btn" onclick="zoomOut()">Zoom Out (-)</button>
            <button class="tool-btn" onclick="resetZoom()">Reset</button>
            <button class="tool-btn" onclick="openOriginal()">Open Full Res</button>
        </div>
    </header>

    <div class="viewer-container" id="viewerContainer">
        <img id="diagramImage" class="diagram-img" src="01_CHEN_ER_DIAGRAM.png" alt="ER Diagram">
    </div>

    <script>
        let currentTab = 'er';
        let zoomLevel = 1.0;
        const imgEl = document.getElementById('diagramImage');

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (tab === 'er') {
                event.target.classList.add('active');
                imgEl.src = '01_CHEN_ER_DIAGRAM.png';
                imgEl.alt = 'Chen ER Diagram';
            } else {
                event.target.classList.add('active');
                imgEl.src = '02_RELATIONAL_SCHEMA_DIAGRAM.png';
                imgEl.alt = 'Relational Schema Diagram';
            }
            resetZoom();
        }

        function zoomIn() {
            zoomLevel += 0.2;
            imgEl.style.transform = `scale(${zoomLevel})`;
            imgEl.style.transformOrigin = 'top center';
        }

        function zoomOut() {
            if (zoomLevel > 0.4) {
                zoomLevel -= 0.2;
                imgEl.style.transform = `scale(${zoomLevel})`;
                imgEl.style.transformOrigin = 'top center';
            }
        }

        function resetZoom() {
            zoomLevel = 1.0;
            imgEl.style.transform = 'scale(1.0)';
        }

        function openOriginal() {
            window.open(imgEl.src, '_blank');
        }
    </script>
</body>
</html>
